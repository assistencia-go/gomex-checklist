<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="35%" stop-color="#141d52"/>
      <stop offset="70%" stop-color="#1e2a78"/>
      <stop offset="100%" stop-color="#2a3492"/>
    </linearGradient>
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo do Ícone de Aplicativo (Squircle Moderno PWA / Android) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6"/>

  <!-- Ícone Exclusivo do Caminhão (Sem textos, perfeitamente centralizado e destacado) -->
  <g transform="translate(88, 81) scale(14)" filter="url(#glow)">
    <!-- Carroceria e Cabine -->
    <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2" fill="none" stroke="url(#truckGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 18H9" stroke="url(#truckGrad)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14" fill="none" stroke="url(#truckGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Janela da Cabine -->
    <path d="M14 8h3.2l2.4 3H14V8z" fill="rgba(255,255,255,0.25)" stroke="none"/>

    <!-- Rodas com Pneus Brancos e Calotas Azuis Gomex -->
    <circle cx="7" cy="18.5" r="2.8" fill="#1e2a78" stroke="url(#truckGrad)" stroke-width="1.8"/>
    <circle cx="7" cy="18.5" r="1.3" fill="#38bdf8"/>

    <circle cx="17" cy="18.5" r="2.8" fill="#1e2a78" stroke="url(#truckGrad)" stroke-width="1.8"/>
    <circle cx="17" cy="18.5" r="1.3" fill="#38bdf8"/>
  </g>
</svg>

name: Gerar APK Android (Gomex Frota)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Inicializar Capacitor e Plataforma Android
        run: |
          npm install
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Gomex Frota" "com.gomex.frota" --web-dir public
          npx cap add android
          npx cap sync android

      - name: Compilar APK Android (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: gomex-frota-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

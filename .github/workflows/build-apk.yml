name: Gerar APK Android (Gomex Frota)

on:
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Inicializar Capacitor e Plataforma Android
        run: |
          npm install
          npm install --save-dev @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Gomex Frota" "com.gomex.frota" --web-dir public
          npx cap add android
          node -e "
            const fs = require('fs');
            const p = 'android/app/src/main/AndroidManifest.xml';
            let m = fs.readFileSync(p, 'utf8');
            const perms = [
              '<uses-permission android:name=\"android.permission.CAMERA\" />',
              '<uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />',
              '<uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />',
              '<uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"29\" />'
            ].filter(line => !m.includes(line)).join('\n    ');
            if (perms) {
              m = m.replace('<application', perms + '\n    <application');
              fs.writeFileSync(p, m, 'utf8');
            }
          "
          npx cap sync android

      - name: Compilar APK Android (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: gomex-frota-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
